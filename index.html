<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wie gut kennst du die Schule von Salamanca?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16244a; --panel:#1f3163; --ink:#f0dfb4; --muted:#c9b98f;
  --accent:#d9a441; --line:rgba(240,223,180,.22); --ok:#8fbf8a; --no:#e08a78;
  --land:#2a3d73; --sea:#16244a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3e7c7; --panel:#eadbb2; --ink:#16244a; --muted:#4a5577;
    --accent:#9a6a12; --line:rgba(22,36,74,.2); --ok:#2f6b2c; --no:#9b2f1f; --land:#dcc893; --sea:#f3e7c7;
  }
}
:root[data-theme="light"]{
  --bg:#f3e7c7; --panel:#eadbb2; --ink:#16244a; --muted:#4a5577;
  --accent:#9a6a12; --line:rgba(22,36,74,.2); --ok:#2f6b2c; --no:#9b2f1f; --land:#dcc893; --sea:#f3e7c7;
}
:root[data-theme="dark"]{
  --bg:#16244a; --panel:#1f3163; --ink:#f0dfb4; --muted:#c9b98f;
  --accent:#d9a441; --line:rgba(240,223,180,.22); --ok:#8fbf8a; --no:#e08a78; --land:#2a3d73; --sea:#16244a;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:1.0625rem; line-height:1.55}
main{max-width:42rem; margin:0 auto; padding:1.25rem 1.25rem 3rem}
header.top{display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:2rem}
.brand{font-family:"IM Fell English",Georgia,serif; font-size:1.05rem; color:var(--muted); text-decoration:none}
.lang{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.lang button{background:none; border:0; color:var(--muted); font:inherit; font-size:.9rem; padding:.3rem .8rem; cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent); color:var(--bg); font-weight:600}
h1,.q-text,.res-title,.levels h2,.net h3{font-family:"IM Fell English",Georgia,"Times New Roman",serif; font-weight:400}
.intro h1{font-size:clamp(2.1rem,7vw,3.3rem); line-height:1.08; margin:0 0 1.25rem}
.intro h1::first-letter{float:left; font-size:3.1em; line-height:.8; margin:.05em .08em 0 0; color:var(--accent)}
.intro p{max-width:34rem; color:var(--muted); margin:0 0 1rem}
.levels{margin-top:1.75rem}
.levels h2{font-size:1.4rem; margin:0 0 .75rem}
.levels ul{list-style:none; padding:0; margin:0; display:grid; gap:.6rem}
.levels button{width:100%; text-align:left; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:4px;
  font:inherit; padding:.9rem 1rem; cursor:pointer; display:grid; gap:.1rem}
.levels button:hover{border-color:var(--accent)}
.levels b{font-weight:600} .levels span{color:var(--muted); font-size:.93rem}
.btn{display:inline-flex; align-items:center; gap:.4rem; background:var(--accent); color:var(--bg); border:0; border-radius:4px;
  font:inherit; font-weight:600; padding:.8rem 1.4rem; cursor:pointer; margin-top:1rem; text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none; color:var(--ink); border:1px solid var(--line)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.progress{display:flex; gap:.35rem; margin-bottom:1.75rem}
.progress span{flex:1; height:4px; border-radius:2px; background:var(--line)}
.progress span.ok{background:var(--ok)} .progress span.no{background:var(--no)} .progress span.cur{background:var(--accent)}
.quaestio{display:grid; grid-template-columns:auto 1fr; gap:0 1.1rem; align-items:start}
.numeral{font-family:"IM Fell English",Georgia,serif; font-size:clamp(3.2rem,12vw,4.6rem); line-height:.85; color:var(--accent); min-width:1.6ch}
.q-kicker{font-family:"IM Fell English",Georgia,serif; font-style:italic; color:var(--muted); margin:0 0 .35rem}
.q-text{font-size:clamp(1.35rem,4.5vw,1.7rem); line-height:1.25; margin:0}
.options{list-style:none; padding:0; margin:1.75rem 0 0; display:grid; gap:.6rem}
.options button{width:100%; text-align:left; background:var(--panel); color:var(--ink); border:1px solid var(--line);
  border-radius:4px; font:inherit; padding:.85rem 1rem; cursor:pointer}
.options button:hover:not(:disabled){border-color:var(--accent)}
.options button:disabled{cursor:default}
.options button.right{border-color:var(--ok); box-shadow:inset 4px 0 0 var(--ok)}
.options button.wrong{border-color:var(--no); box-shadow:inset 4px 0 0 var(--no)}
.options button.dim{opacity:.55}
.feedback{margin-top:1.5rem; padding:1.1rem 1.2rem; border-left:3px solid var(--accent); background:var(--panel)}
.feedback h3{margin:0 0 .4rem; font-size:1.05rem}
.feedback.ok h3{color:var(--ok)} .feedback.no h3{color:var(--no)}
.feedback p{margin:0 0 .6rem}
.feedback .lit{font-size:.93rem; color:var(--muted)}
.feedback .src a{color:var(--ink); font-weight:500}
.feedback .src::before{content:"📖 "}
.feedback .more::before{content:"✒️ "}
.mapwrap{margin:.9rem 0 .2rem}
.mapwrap svg,.maps svg{display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:4px; background:var(--sea)}
.mapcap{font-size:.88rem; color:var(--muted); margin:.35rem 0 0}
svg .land{fill:var(--land)} svg .arc{fill:none; stroke:var(--accent); stroke-width:1.4; stroke-dasharray:4 3; opacity:.8}
svg .arc.no{opacity:.6} svg .arc.other{stroke:var(--muted); opacity:.3; stroke-dasharray:2 4}
svg .home{fill:var(--ink)} svg .pt.ok{fill:var(--accent)} svg .pt.no{fill:var(--sea); stroke:var(--accent); stroke-width:2.5}
svg .pt.other{fill:var(--muted); opacity:.7} svg .lbl.other{fill:var(--muted); font-weight:400} svg .home-lbl{font-weight:600}
svg .lbl{fill:var(--ink); font:500 22px "Work Sans",system-ui,sans-serif; paint-order:stroke; stroke:var(--sea); stroke-width:4px}
svg .box{fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3}
.result{text-align:center; padding-top:1rem}
.score{font-family:"IM Fell English",Georgia,serif; font-size:clamp(4rem,18vw,6.5rem); line-height:1; color:var(--accent); margin:0}
.score small{font-size:.4em; color:var(--muted)}
.lvl-tag{color:var(--muted); margin:.3rem 0 0}
.res-title{font-size:clamp(1.7rem,5.5vw,2.3rem); margin:.6rem 0 .8rem}
.result > p{max-width:32rem; margin:0 auto 1rem; color:var(--muted)}
.actions{display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap}
.share-note{min-height:1.5em; font-size:.9rem; color:var(--ok); margin:.5rem 0 0}
.net{text-align:left; margin-top:2.5rem}
.net h3{font-size:1.5rem; margin:0 0 .4rem}
.net > p{color:var(--muted); margin:0 0 1rem}
.net .maps{display:grid; gap:.75rem}
.legend{list-style:none; padding:0; margin:.9rem 0 0; display:flex; flex-wrap:wrap; gap:.4rem 1.2rem; font-size:.9rem; color:var(--muted)}
.legend li{display:flex; align-items:center; gap:.45rem}
.dot{display:inline-block; width:.75rem; height:.75rem; border-radius:50%}
.dot.ok{background:var(--accent)} .dot.no{border:2px solid var(--accent)} .dot.other{background:var(--muted); opacity:.7; width:.55rem; height:.55rem}
footer{margin-top:3rem; font-size:.88rem; color:var(--muted); border-top:1px solid var(--line); padding-top:1rem}
footer a{color:var(--ink)}
.fade{animation:in .35s ease-out}
@keyframes in{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}
</style>
</head>

  e:"Latein war die Sprache der Gelehrten in ganz Europa. Einige Werke, etwa Handbücher für Beichtväter oder Kaufleute, erschienen aber auch auf Spanisch, damit mehr Menschen sie lesen konnten."},
 en:{q:"In which language did they mostly write their scholarly works?", o:["Latin","German","French","Arabic"],
  e:"Latin was the language of scholars across Europe. Some works, such as handbooks for confessors or merchants, also appeared in Spanish so more people could read them."}},
{place:"mexico", src:["W0013","Vitoria, Relectiones (Lyon 1557)"],
 de:{q:"Die Eroberung welcher Weltregion warf für die Schule die größten neuen Fragen auf?", o:["Amerika","Australien","Die Antarktis","Sibirien"],
  e:"Die spanische Eroberung Amerikas stellte drängende Fragen: Dürfen die Spanier dort herrschen? Welche Rechte haben die indigenen Völker? Vitoria und seine Schüler stritten darüber öffentlich."},
 en:{q:"The conquest of which region raised the biggest new questions for the School?", o:["The Americas","Australia","Antarctica","Siberia"],
  e:"The Spanish conquest of the Americas raised urgent questions: may the Spanish rule there? What rights do Indigenous peoples have? Vitoria and his students debated this openly."}},
{place:"valladolid", src:["W0034","Las Casas, Treinta proposiciones (Sevilla 1552)"], lit:"Anthony Pagden, <i>The Fall of Natural Man</i>, 1982.",
 de:{q:"Wer war 1550–51 in Valladolid der Gegenspieler von Juan Ginés de Sepúlveda?", o:["Bartolomé de las Casas","Francisco de Vitoria","Hugo Grotius","Luis de Molina"],
  e:"Las Casas widersprach Sepúlvedas Rechtfertigung der Unterwerfung der indigenen Völker. Vitoria war zu diesem Zeitpunkt bereits verstorben (1546)."},
 en:{q:"Who opposed Juan Ginés de Sepúlveda at Valladolid in 1550–51?", o:["Bartolomé de las Casas","Francisco de Vitoria","Hugo Grotius","Luis de Molina"],
  e:"Las Casas contested Sepúlveda's justification for subjugating Indigenous peoples. Vitoria had already died (1546)."}},
{place:"salamanca", src:["W0011","Soto, De iustitia et iure (Salamanca 1553)"],
 de:{q:"Vitoria und Domingo de Soto gehörten demselben Orden an. Welchem?", o:["Den Dominikanern","Den Benediktinern","Den Templern","Den Kartäusern"],
  e:"Beide waren Dominikaner und lebten im Konvent San Esteban in Salamanca. Später wurden Jesuiten wie Molina und Suárez zu zentralen Autoren."},
 en:{q:"Vitoria and Domingo de Soto belonged to the same order. Which one?", o:["The Dominicans","The Benedictines","The Templars","The Carthusians"],
  e:"Both were Dominicans and lived in the convent of San Esteban in Salamanca. Later, Jesuits such as Molina and Suárez became central authors."}},
{place:"salamanca", src:["W0002","Azpilcueta, Manual de confessores (Salamanca 1556)"], lit:"Wim Decock, <i>Theologians and Contract Law</i>, 2013.",
 de:{q:"Über welche Alltagsfrage stritten die Gelehrten besonders gern?", o:["Was ein gerechter Preis ist","Wie man Schiffe baut","Welches Brot am besten schmeckt","Wie man das Wetter vorhersagt"],
  e:"Darf ein Händler bei einer Missernte mehr verlangen? Ist Zins erlaubt? Solche Fragen beschäftigten Beichtväter und Kaufleute gleichermaßen, und die Gelehrten gaben Antworten."},
 en:{q:"Which everyday question did the scholars love to debate?", o:["What a fair price is","How to build ships","Which bread tastes best","How to forecast the weather"],
  e:"May a merchant charge more after a bad harvest? Is interest allowed? Confessors and merchants alike needed answers, and the scholars provided them."}},
{place:"antwerpen", src:["W0008","Molina, De iustitia et iure (Cuenca/Antwerpen)"],
 de:{q:"Wie reisten die Ideen der Schule um die Welt?", o:["Mit gedruckten Büchern","Per Telegraf","Im Radio","Per Brieftaube"],
  e:"Werke aus Salamanca wurden in Städten wie Lyon, Antwerpen und Frankfurt nachgedruckt und reisten auf Schiffen bis nach Mexiko, Lima und Manila."},
 en:{q:"How did the School's ideas travel the world?", o:["In printed books","By telegraph","On the radio","By carrier pigeon"],
  e:"Works from Salamanca were reprinted in cities such as Lyon, Antwerp and Frankfurt and travelled by ship as far as Mexico, Lima and Manila."}},
{place:"leiden", src:["W0106","Vázquez de Menchaca, Controversiae (Frankfurt 1572)"], lit:"Martti Koskenniemi, <i>To the Uttermost Parts of the Earth</i>, 2021.",
 de:{q:"Welcher niederländische Jurist stützte sich in <i>Mare liberum</i> (1609) auf Salmantiner Autoren?", o:["Hugo Grotius","Rembrandt van Rijn","Erasmus von Rotterdam","Baruch de Spinoza"],
  e:"Grotius berief sich für die Freiheit der Meere unter anderem auf Vitoria und Fernando Vázquez de Menchaca. So wurden Salmantiner Argumente Teil der Geschichte des Völkerrechts."},
 en:{q:"Which Dutch jurist drew on Salamanca authors in <i>Mare liberum</i> (1609)?", o:["Hugo Grotius","Rembrandt van Rijn","Erasmus of Rotterdam","Baruch Spinoza"],
  e:"To argue for the freedom of the seas, Grotius cited Vitoria and Fernando Vázquez de Menchaca, among others. This is how Salamanca arguments became part of the history of international law."}}
],
medium:[
{place:"salamanca", src:["W0013","Vitoria, Relectiones (Lyon 1557)"], lit:"Anthony Pagden, <i>The Fall of Natural Man</i>, 1982; Martti Koskenniemi, <i>To the Uttermost Parts of the Earth</i>, 2021.",
 de:{q:"In welcher Relectio fragte Vitoria nach der Rechtmäßigkeit der spanischen Herrschaft in Amerika?", o:["De Indis","De legibus","De iustitia et iure","Mare liberum"],
  e:"In <i>De Indis</i> (vorgetragen Ende der 1530er Jahre) prüfte Vitoria, welche Titel die Herrschaft über die indigenen Völker rechtfertigen könnten, und verwarf viele der damals üblichen Begründungen."},
 en:{q:"In which relectio did Vitoria question the legitimacy of Spanish rule in the Americas?", o:["De Indis","De legibus","De iustitia et iure","Mare liberum"],
  e:"In <i>De Indis</i> (delivered in the late 1530s), Vitoria examined which titles could justify dominion over Indigenous peoples, and rejected many of the arguments common at the time."}},
{place:"salamanca", src:["W0002","Azpilcueta, Manual de confessores (Salamanca 1556)"], lit:"Marjorie Grice-Hutchinson, <i>The School of Salamanca: Readings in Spanish Monetary Theory, 1544–1605</i>, 1952.",
 de:{q:"Wer brachte 1556 steigende Preise mit dem Überfluss an Geld, etwa Silber aus Amerika, in Verbindung?", o:["Martín de Azpilcueta","Francisco de Vitoria","Melchor Cano","Francisco Suárez"],
  e:"Martín de Azpilcueta, genannt Doctor Navarrus, beschrieb im <i>Comentario resolutorio de cambios</i> (1556), dass Geld dort weniger wert ist, wo es reichlich vorhanden ist. Das gilt als frühe Form der Quantitätstheorie."},
 en:{q:"Who linked rising prices to an abundance of money, such as silver from the Americas, in 1556?", o:["Martín de Azpilcueta","Francisco de Vitoria","Melchor Cano","Francisco Suárez"],
  e:"Martín de Azpilcueta, known as Doctor Navarrus, observed in his <i>Comentario resolutorio de cambios</i> (1556) that money is worth less where it is plentiful. This is seen as an early form of the quantity theory of money."}},
{place:"salamanca", src:["W0011","Soto, De iustitia et iure (Salamanca 1553)"], lit:"Wim Decock, <i>Theologians and Contract Law</i>, 2013.",
 de:{q:"Welchen Titel trugen große Werke von Domingo de Soto und Luis de Molina gleichermaßen?", o:["De iustitia et iure","De iure belli ac pacis","Summa theologiae","Leviathan"],
  e:"<i>De iustitia et iure</i> wurde zu einer eigenen Gattung: Theologen behandelten darin Eigentum, Verträge, Preise und Restitution."},
 en:{q:"Which title did major works by Domingo de Soto and Luis de Molina share?", o:["De iustitia et iure","De iure belli ac pacis","Summa theologiae","Leviathan"],
  e:"<i>De iustitia et iure</i> became a genre of its own: theologians used it to treat property, contracts, prices and restitution."}},
{place:"evora", src:["W0008","Molina, De iustitia et iure (Cuenca/Antwerpen)"], lit:"Matthias Kaufmann, Alexander Aichele (Hg./eds.), <i>A Companion to Luis de Molina</i>, Brill 2014.",
 de:{q:"An welcher Universität lehrte Luis de Molina über viele Jahre?", o:["Évora","Salamanca","Mexiko-Stadt","Rom"],
  e:"Molina verbrachte fast seine gesamte Lehrtätigkeit in Portugal, vor allem in Évora. Die Schule von Salamanca war nie nur an einen Ort gebunden."},
 en:{q:"At which university did Luis de Molina teach for many years?", o:["Évora","Salamanca","Mexico City","Rome"],
  e:"Molina spent almost his entire teaching career in Portugal, above all in Évora. The School of Salamanca was never tied to just one place."}},
{place:"coimbra", lit:"Annabel S. Brett, <i>Changes of State</i>, 2011.",
 de:{q:"Welches große Werk über das Gesetz veröffentlichte Francisco Suárez 1612 in Coimbra?", o:["De legibus ac Deo legislatore","De Indis","Mare liberum","Manual de confesores y penitentes"],
  e:"<i>De legibus ac Deo legislatore</i> ist eine umfassende Theorie des Gesetzes, vom ewigen und natürlichen Gesetz bis zum menschlichen Recht, und wurde in ganz Europa gelesen."},
 en:{q:"Which major work on law did Francisco Suárez publish in Coimbra in 1612?", o:["De legibus ac Deo legislatore","De Indis","Mare liberum","Manual de confesores y penitentes"],
  e:"<i>De legibus ac Deo legislatore</i> is a comprehensive theory of law, from eternal and natural law to human law, and was read across Europe."}},
{place:"salamanca", src:["W0002","Azpilcueta, Manual de confessores (Salamanca 1556)"], lit:"Thomas Duve, Otto Danwerth (Hg./eds.), <i>Knowledge of the Pragmatici</i>, Brill 2020 (open access).",
 de:{q:"Eines der meistgedruckten Werke eines Salmantiner Autors war …", o:["ein Handbuch für Beichtväter","ein Ritterroman","eine Weltkarte","ein Kochbuch"],
  e:"Azpilcuetas <i>Manual de confesores y penitentes</i> erschien in zahlreichen Auflagen und Übersetzungen. Über solche praktischen Bücher verbreitete sich normatives Wissen weit über die Universität hinaus."},
 en:{q:"One of the most frequently printed works by a Salamanca author was …", o:["a manual for confessors","a chivalric romance","a world map","a cookbook"],
  e:"Azpilcueta's <i>Manual de confesores y penitentes</i> went through many editions and translations. Practical books like this carried normative knowledge far beyond the university."}},
{place:"madrid", lit:"Thomas Duve, „The School of Salamanca: A Case of Global Knowledge Production“, in: Duve, Egío, Birr (Hg./eds.), Brill 2021.",
 de:{q:"Wann wurde der Begriff „Schule von Salamanca“ geprägt?", o:["Im späten 19. Jahrhundert","Im 16. Jahrhundert, von Vitorias Schülern","Im 17. Jahrhundert, von Francisco Suárez","In den 1950er Jahren, von Wirtschaftshistorikern"],
  e:"Vitorias Schüler verstanden sich zwar schon als seine Schüler, doch der Begriff selbst entstand erst im späten 19. Jahrhundert. Damals wurde die Schule als wichtiger Moment des europäischen Rechts- und Staatsdenkens neu entdeckt, mit Vitoria als Hauptfigur und dem Völkerrecht als bekanntestem Thema. Dahinter stand der Wunsch, Spaniens Beitrag zur europäischen Wissenschaft sichtbar zu machen, etwa in Eduardo de Hinojosas Vortrag über Vitoria an der Real Academia de la Historia in Madrid (1889)."},
 en:{q:"When was the term “School of Salamanca” coined?", o:["In the late nineteenth century","In the sixteenth century, by Vitoria's students","In the seventeenth century, by Francisco Suárez","In the 1950s, by economic historians"],
  e:"Vitoria's students already saw themselves as his disciples, but the term itself was only coined in the late nineteenth century. The School was then rediscovered as an important moment in European political and legal thought, with Vitoria as its central figure and international law as its best-known subject. Behind this lay the wish to make Spain's contribution to European learning visible, as in Eduardo de Hinojosa's lecture on Vitoria at the Real Academia de la Historia in Madrid (1889)."}},
{place:"salamanca", src:["W0063","Gregorio López, Siete Partidas (Salamanca 1555)"],
 de:{q:"Wer druckte 1555 in Salamanca die von Gregorio López glossierten <i>Siete Partidas</i>?", o:["Andrea de Portonariis","Aldus Manutius","Christoph Plantin","Johannes Gutenberg"],
  e:"Andrea de Portonariis (Andrés de Portonaris) stammte aus einer italienischen Druckerfamilie und gehörte zu den wichtigsten Druckern Salamancas. Er druckte auch Sotos <i>De iustitia et iure</i> (1553)."},
 en:{q:"Who printed Gregorio López's glossed <i>Siete Partidas</i> in Salamanca in 1555?", o:["Andrea de Portonariis","Aldus Manutius","Christophe Plantin","Johannes Gutenberg"],
  e:"Andrea de Portonariis (Andrés de Portonaris) came from an Italian family of printers and was one of Salamanca's most important printers. He also printed Soto's <i>De iustitia et iure</i> (1553)."}},
{place:"cuenca", src:["W0008","Molina, De iustitia et iure (Cuenca/Antwerpen)"], more:"https://legalhistoryinsights.com/from-paper-to-screen-lessons-from-the-digital-edition-of-luis-de-molinas-de-iustitia-et-iure/",
 de:{q:"Wo erschien 1593 der erste Band von Molinas <i>De iustitia et iure</i>?", o:["Cuenca","Salamanca","Rom","Paris"],
  e:"Der erste Band erschien 1593 in Cuenca bei Juan Masselin. Spätere Bände wurden in Antwerpen gedruckt: ein Werk, zwei Druckorte, zwei Buchmärkte."},
 en:{q:"Where did the first volume of Molina's <i>De iustitia et iure</i> appear in 1593?", o:["Cuenca","Salamanca","Rome","Paris"],
  e:"The first volume appeared in Cuenca in 1593, printed by Juan Masselin. Later volumes were printed in Antwerp: one work, two printing places, two book markets."}},
{place:"lima", src:["W0076","Moreno, Reglas ciertas (México 1637)"], lit:DUVE,
 de:{q:"Welche beiden Universitäten wurden 1551 in Amerika gegründet?", o:["Mexiko und Lima","Harvard und Yale","Buenos Aires und Santiago","Havanna und Bogotá"],
  e:"1551 wurden die Universitäten von Mexiko und Lima gegründet, nach dem Vorbild Salamancas. Hier wurde das Wissen der Schule gelehrt, angepasst und weiterentwickelt, und in Mexiko wurden bald auch eigene Werke gedruckt."},
 en:{q:"Which two universities were founded in the Americas in 1551?", o:["Mexico and Lima","Harvard and Yale","Buenos Aires and Santiago","Havana and Bogotá"],
  e:"The universities of Mexico and Lima were founded in 1551, modelled on Salamanca. There the School's knowledge was taught, adapted and developed further, and works were soon printed in Mexico too."}}
],
hard:[
{place:"mexico", lit:DUVE,
 de:{q:"Welcher Schüler Vitorias lehrte ab den 1550er Jahren an der Universität von Mexiko?", o:["Alonso de la Vera Cruz","Domingo de Soto","Luis de Molina","Juan de Solórzano Pereira"],
  e:"Der Augustiner Alonso de la Vera Cruz hatte in Salamanca studiert und hielt in Mexiko eigene Relectiones über Herrschaft und gerechten Krieg. So wurde die Schule in Amerika selbst weitergedacht."},
 en:{q:"Which student of Vitoria taught at the University of Mexico from the 1550s?", o:["Alonso de la Vera Cruz","Domingo de Soto","Luis de Molina","Juan de Solórzano Pereira"],
  e:"The Augustinian Alonso de la Vera Cruz had studied at Salamanca and gave his own relectiones in Mexico on dominion and just war. The School was developed further in the Americas themselves."}},
{place:"antwerpen", src:["W0001","Avendaño, Thesaurus Indicus (Antwerpen 1668)"], lit:DUVE,
 de:{q:"Ein Jesuit in Lima schrieb ein mehrbändiges Handbuch für Gewissensfragen in den spanischen Überseegebieten, den <i>Thesaurus Indicus</i>. Gedruckt wurde es in Antwerpen. Wer war der Autor?", o:["Diego de Avendaño","José de Acosta","Juan de Solórzano Pereira","Alonso de la Vera Cruz"],
  e:"Diego de Avendaño lebte und lehrte jahrzehntelang in Lima. Sein <i>Thesaurus Indicus</i> erschien ab 1668 in Antwerpen: Wissen, das in Amerika entstand, wurde in Europa gedruckt und von dort wieder in die Welt verschickt."},
 en:{q:"A Jesuit in Lima wrote a multi-volume handbook on questions of conscience in Spain's overseas territories, the <i>Thesaurus Indicus</i>. It was printed in Antwerp. Who was the author?", o:["Diego de Avendaño","José de Acosta","Juan de Solórzano Pereira","Alonso de la Vera Cruz"],
  e:"Diego de Avendaño lived and taught in Lima for decades. His <i>Thesaurus Indicus</i> appeared in Antwerp from 1668 onwards: knowledge produced in the Americas was printed in Europe and sent out into the world again."}},
{place:"manila", lit:DUVE,
 de:{q:"Welcher in Salamanca ausgebildete Dominikaner wurde der erste Bischof von Manila?", o:["Domingo de Salazar","Franz Xaver","Alonso de la Vera Cruz","José de Acosta"],
  e:"Domingo de Salazar brachte die Salmantiner Debatten über gerechte Herrschaft auf die Philippinen und setzte sich dort für die Rechte der einheimischen Bevölkerung ein."},
 en:{q:"Which Salamanca-trained Dominican became the first bishop of Manila?", o:["Domingo de Salazar","Francis Xavier","Alonso de la Vera Cruz","José de Acosta"],
  e:"Domingo de Salazar carried the Salamanca debates on just rule to the Philippines, where he defended the rights of the local population."}},
{place:"lima", src:["W0010","Solórzano, Política indiana (Madrid 1648)"],
 de:{q:"Welcher Jurist, Professor in Salamanca und später Richter (oidor) in Lima, schrieb die <i>Política indiana</i>?", o:["Juan de Solórzano Pereira","Diego de Avendaño","Gregorio López","Martín de Azpilcueta"],
  e:"Juan de Solórzano Pereira verband Lehre in Salamanca und Praxis in Lima. Seine <i>Política indiana</i> (1648) wurde zu einem Standardwerk des Rechts der spanischen Überseegebiete."},
 en:{q:"Which jurist, a Salamanca professor and later judge (oidor) in Lima, wrote the <i>Política indiana</i>?", o:["Juan de Solórzano Pereira","Diego de Avendaño","Gregorio López","Martín de Azpilcueta"],
  e:"Juan de Solórzano Pereira combined teaching in Salamanca with practice in Lima. His <i>Política indiana</i> (1648) became a standard work on the law of Spain's overseas territories."}},
{place:"madrid", src:["W0063","Gregorio López, Siete Partidas (Salamanca 1555)"],
 de:{q:"Viele kastilische Bücher beginnen mit einer „tasa“. Was legte sie fest?", o:["Den amtlichen Höchstpreis, berechnet pro Druckbogen","Das königliche Druckprivileg","Die Druckerlaubnis des Zensors","Die Widmung an einen Gönner"],
  e:"Die tasa setzte den Verkaufspreis fest, meist pro Bogen (pliego). Privileg, Zensurgutachten und Widmung standen oft daneben in den Vorstücken: Sie verraten viel über die Wege eines Buches."},
 en:{q:"Many Castilian books open with a “tasa”. What did it set?", o:["The official maximum price, calculated per printed sheet","The royal printing privilege","The censor's licence to print","The dedication to a patron"],
  e:"The tasa fixed the sale price, usually per sheet (pliego). Privilege, censor's approval and dedication often sat alongside it in the preliminaries: together they tell us a lot about a book's journey."}},
{place:"salamanca", src:["W0002","Azpilcueta, Manual de confessores (Salamanca 1556)"], lit:"Manuela Bragagnolo, „Legal Authorship in the Age of the Printing Press: <i>Manual de Confessores</i> by Martín de Azpilcueta (1492–1586)“, in: dies./ead. (Hg./ed.), <i>The Production of Knowledge of Normativity in the Age of the Printing Press</i>, Brill 2024.",
 de:{q:"Ein Bestseller, ein Raubdruck und ein Prozess: Welcher Autor musste vor den königlichen Gerichten verteidigen, dass sein Buch wirklich sein eigenes Werk war?", o:["Martín de Azpilcueta","Francisco de Vitoria","Domingo de Soto","Luis de Molina"],
  e:"Als Drucker eine nicht autorisierte Ausgabe seines spanischen <i>Manual de confesores</i> herausbrachten, zog Azpilcueta vor Gericht. Die Drucker bestritten, dass er der eigentliche Autor sei; davon hing aber sein königliches Druckprivileg ab. Azpilcueta begründete seine Autorschaft ausführlich und behielt das Privileg. Der Fall ist eine der seltenen Quellen dazu, wie frühneuzeitliche Autorschaft im Recht verhandelt wurde."},
 en:{q:"A bestseller, a pirate edition and a lawsuit: which author had to defend before the royal courts that his book was truly his own work?", o:["Martín de Azpilcueta","Francisco de Vitoria","Domingo de Soto","Luis de Molina"],
  e:"When printers brought out an unauthorised edition of his Spanish <i>Manual de confesores</i>, Azpilcueta went to court. The printers disputed that he was really its author, and his royal printing privilege depended on exactly that. Azpilcueta argued his authorship in detail and kept the privilege. The case is one of the rare sources on how early modern authorship was negotiated in law."}},
{place:"sevilla", src:["W0007","Mercado, Suma de tratos y contratos (Salamanca 1569)"], lit:"Wim Decock, <i>Theologians and Contract Law</i>, 2013.",
 de:{q:"Welcher Dominikaner, der in Mexiko in den Orden eingetreten war, schrieb ein Handbuch über Handelsverträge für die Kaufleute Sevillas?", o:["Tomás de Mercado","Luis de Alcalá","Cristóbal de Villalón","Juan de Medina"],
  e:"Tomás de Mercado kannte den Atlantikhandel aus eigener Anschauung. Seine <i>Suma de tratos y contratos</i> erklärte Kaufleuten auf Spanisch, welche Geschäfte gerecht sind."},
 en:{q:"Which Dominican, who had joined the order in Mexico, wrote a handbook on commercial contracts for the merchants of Seville?", o:["Tomás de Mercado","Luis de Alcalá","Cristóbal de Villalón","Juan de Medina"],
  e:"Tomás de Mercado knew Atlantic trade first-hand. His <i>Suma de tratos y contratos</i> explained to merchants, in Spanish, which deals were just."}},
{place:"lyon", src:["W0013","Vitoria, Relectiones (Lyon 1557)"],
 de:{q:"Vitoria veröffentlichte seine Relectiones nie selbst. Wo erschienen sie 1557 erstmals im Druck?", o:["Lyon","Salamanca","Rom","Venedig"],
  e:"Die erste Ausgabe erschien 1557 in Lyon, elf Jahre nach Vitorias Tod, mit einem Privileg des französischen Königs. Ein Salmantiner Klassiker kam also zuerst aus Frankreich."},
 en:{q:"Vitoria never published his relectiones himself. Where were they first printed in 1557?", o:["Lyon","Salamanca","Rome","Venice"],
  e:"The first edition appeared in Lyon in 1557, eleven years after Vitoria's death, with a privilege from the French king. A Salamanca classic first came from France."}},
{place:"valladolid", src:["W0046","Freitas, De iusto imperio Lusitanorum Asiatico (Valladolid 1625)"], lit:"Martti Koskenniemi, <i>To the Uttermost Parts of the Earth</i>, 2021.",
 de:{q:"Wer antwortete 1625 mit <i>De iusto imperio Lusitanorum Asiatico</i> auf Grotius’ <i>Mare liberum</i>?", o:["Serafim de Freitas","Fernando Vázquez de Menchaca","Juan de Solórzano Pereira","Francisco Suárez"],
  e:"Der portugiesische Mercedarier Serafim de Freitas, Professor in Valladolid, verteidigte die portugiesischen Ansprüche in Asien gegen Grotius. Die Debatte über die Meere war ein globaler Streit."},
 en:{q:"Who answered Grotius's <i>Mare liberum</i> in 1625 with <i>De iusto imperio Lusitanorum Asiatico</i>?", o:["Serafim de Freitas","Fernando Vázquez de Menchaca","Juan de Solórzano Pereira","Francisco Suárez"],
  e:"The Portuguese Mercedarian Serafim de Freitas, a professor at Valladolid, defended Portugal's claims in Asia against Grotius. The debate over the seas was a global dispute."}},
{place:"frankfurt", src:["W0006","Covarrubias, Opera omnia (Frankfurt 1573)"],
 de:{q:"Die Werke von Diego de Covarrubias und Fernando Vázquez de Menchaca liegen in der digitalen Sammlung in Ausgaben aus welcher Stadt vor?", o:["Frankfurt am Main","Lyon","Venedig","Paris"],
  e:"Beide Ausgaben stammen aus Frankfurt, das mit seiner Buchmesse ein Knotenpunkt des europäischen Buchhandels war. Salmantiner Recht wurde also auch mitten in Deutschland gedruckt und verkauft."},
 en:{q:"The works of Diego de Covarrubias and Fernando Vázquez de Menchaca appear in the digital collection in editions from which city?", o:["Frankfurt am Main","Lyon","Venice","Paris"],
  e:"Both editions come from Frankfurt, whose book fair made it a hub of the European book trade. Salamanca law was printed and sold in the heart of Germany too."}}
]};

 {min:3,  de:["Erstes Semester","Du weißt, wo die Universität steht. Jetzt wartet die Bibliothek auf dich."],
          en:["First semester","You know where the university is. Now the library awaits."]},
 {min:0,  de:["Noch vor den Stadttoren","Die gute Nachricht: Die ganze Bibliothek ist online, und niemand verlangt eine tasa."],
          en:["Still outside the city gates","Good news: the whole library is online, and no one charges a tasa."]}
];

const UI = {
 de:{brand:"Schule von Salamanca", title:"Wie gut kennst du die Schule von Salamanca?",
     intro:"Zehn Fragen zu Theologen und Juristen, die im 16. und 17. Jahrhundert über Recht, Handel, Macht und Gewissen nachdachten, von Salamanca bis Lima und Manila.",
     intro2:"Nach jeder Antwort erfährst du mehr, siehst den Ort auf der Karte und kannst die Quelle im Original lesen.",
     choose:"Wähle deine Stufe",
     lv:{easy:["Einsteiger","Für alle, die neugierig sind"],medium:["Fortgeschritten","Für alle, die schon einmal von Vitoria gehört haben"],hard:["Profi","Für alle, die Molina im Original lesen"]},
     of:"von", q:"Quaestio", ok:"Richtig.", no:"Nicht ganz. Richtig wäre:", read:"Zum Weiterlesen:", src:"Im Original lesen:", more:"Mehr über die spannende Druckgeschichte von Molinas Werk im Blog Legal History Insights",
     next:"Nächste Frage", finish:"Ergebnis ansehen", again:"Noch einmal spielen", other:"Andere Stufe wählen", visit:"Zur digitalen Sammlung",
     share:"Ergebnis teilen", copied:"Text mit Link kopiert.", level:"Stufe",
     net:"Die Schule von Salamanca als globales Netzwerk", netp:"Die Schule war nie nur ein Ort. Ihr Wissen wurde zwischen Europa, Amerika und Asien gelehrt, gedruckt, gelesen und weiterentwickelt. Die Karte zeigt alle Orte aus dem Quiz; hervorgehoben sind die Orte deiner Runde.",
     lgOk:"In deiner Runde richtig beantwortet", lgNo:"In deiner Runde noch offen", lgOther:"Weitere Orte im Netzwerk",
     europe:"Ausschnitt Europa",
     shareText:(s,l,t)=>`Ich habe ${s}/10 im Salamanca-Quiz (Stufe ${l}) geschafft: ${t}! Wie gut kennst du die Schule von Salamanca?`,
     foot:'Die Quellen selbst lesen: <a href="https://www.salamanca.school" target="_blank" rel="noopener">salamanca.school</a>'},
 en:{brand:"School of Salamanca", title:"How well do you know the School of Salamanca?",
     intro:"Ten questions about theologians and jurists who reflected on law, trade, power and conscience in the sixteenth and seventeenth centuries, from Salamanca to Lima and Manila.",
     intro2:"After each answer you learn more, see the place on the map and can read the source in the original.",
     choose:"Choose your level",
     lv:{easy:["Beginner","For the curious"],medium:["Intermediate","For those who have heard of Vitoria"],hard:["Expert","For those who read Molina in the original"]},
     of:"of", q:"Quaestio", ok:"Correct.", no:"Not quite. The answer is:", read:"Further reading:", src:"Read the original:", more:"Learn more about the fascinating publication history of Molina's book on Legal History Insights",
     next:"Next question", finish:"See your result", again:"Play again", other:"Choose another level", visit:"Visit the digital collection",
     share:"Share my result", copied:"Text and link copied.", level:"Level",
     net:"The School of Salamanca as a global network", netp:"The School was never just one place. Its knowledge was taught, printed, read and developed further between Europe, the Americas and Asia. The map shows every place in the quiz; the places from your round are highlighted.",
     lgOk:"Answered correctly in your round", lgNo:"Still to discover in your round", lgOther:"Other places in the network",
     europe:"Europe detail",
     shareText:(s,l,t)=>`I scored ${s}/10 in the Salamanca quiz (${l} level): ${t}! How well do you know the School of Salamanca?`,
     foot:'Read the sources yourself: <a href="https://www.salamanca.school" target="_blank" rel="noopener">salamanca.school</a>'}
};

const ROMAN=["I","II","III","IV","V","VI","VII","VIII","IX","X"];
const EUROPE = new Set(["salamanca","valladolid","madrid","cuenca","sevilla","evora","coimbra","lyon","antwerpen","leiden","frankfurt","london"]);
let lang = (navigator.language||"de").toLowerCase().startsWith("de") ? "de" : "en";
let state = {screen:"intro"};
const app = document.getElementById("app");

function shuffle(n){const a=[...Array(n).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newGame(level){state={screen:"quiz", level, i:0, answers:[], order:LEVELS[level].map(()=>shuffle(4))}; render();}

function arc(a,b){const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, dx=b[0]-a[0], dy=b[1]-a[1], d=Math.hypot(dx,dy);
  if(d<1) return ""; let nx=-dy/d, ny=dx/d; if(ny>0){nx=-nx; ny=-ny;} const off=Math.min(d*.22,110);
  return `M${a[0]},${a[1]} Q${(mx+nx*off).toFixed(1)},${(my+ny*off).toFixed(1)} ${b[0]},${b[1]}`;}

/* places: array of {id, st} with st = "ok" | "no" | "other"; view: "w" (world) or "e" (Europe) */
function mapSVG(view, places, showLabels){
  const W=800, H= view==="w"?400:520, key=view;
  const home=MAP.pts.salamanca[key];
  const inView=b=>b&&b[0]>=0&&b[0]<=W&&b[1]>=0&&b[1]<=H;
  const list=places.filter(p=>p.id!=="salamanca"&&inView(MAP.pts[p.id][key])&&!(view==="w"&&EUROPE.has(p.id)));
  list.sort((x,y)=>(x.st==="other"?0:1)-(y.st==="other"?0:1));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${places.map(p=>PLACES[p.id][lang]).join(", ")}"><path class="land" d="${view==="w"?MAP.pathW:MAP.pathE}"/>`;
  if(view==="w"){const [[x0,y0],[x1,y1]]=MAP.box; s+=`<rect class="box" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}"/>`;}
  for(const p of list) s+=`<path class="arc ${p.st}" d="${arc(home,MAP.pts[p.id][key])}"/>`;
  s+=`<circle class="home" cx="${home[0]}" cy="${home[1]}" r="${view==="w"?5:8}"/>`;
  const r=view==="w"?6:9;
  for(const p of list){ const b=MAP.pts[p.id][key];
    s+=`<circle class="pt ${p.st}" cx="${b[0]}" cy="${b[1]}" r="${p.st==="other"?r*.7:r}"/>`;
    if(showLabels){ const o=LABEL_OFFSET[p.id]||[10,5];
      s+=`<text class="lbl ${p.st}" x="${b[0]+o[0]}" y="${b[1]+o[1]}" text-anchor="${o[2]||"start"}">${PLACES[p.id][lang]}</text>`; } }
  if(showLabels){ const o= view==="w"?[-10,22,"end"]:(LABEL_OFFSET.salamanca);
    s+=`<text class="lbl home-lbl" x="${home[0]+o[0]}" y="${home[1]+o[1]}" text-anchor="${o[2]||"start"}">Salamanca</text>`; }
  return s+"</svg>";
}

function header(){
  const t=UI[lang];
  return `<header class="top"><a class="brand" href="https://www.salamanca.school" target="_blank" rel="noopener">${t.brand}</a>
  <div class="lang" role="group" aria-label="Sprache / Language">
   <button data-lang="de" aria-pressed="${lang==="de"}">DE</button><button data-lang="en" aria-pressed="${lang==="en"}">EN</button></div></header>`;
}
function footer(){return `<footer>${UI[lang].foot}</footer>`;}
function scoreOf(){return state.answers.filter(a=>a===0).length;}
function resultOf(){return RESULTS.find(x=>scoreOf()>=x.min)[lang];}

function render(){
  document.documentElement.lang=lang;
  const t=UI[lang]; document.title=t.title;
  let body="";
  if(state.screen==="intro"){
    const lv=["easy","medium","hard"].map(k=>`<li><button data-level="${k}"><b>${t.lv[k][0]}</b><span>${t.lv[k][1]}</span></button></li>`).join("");
    body=`<section class="intro fade"><h1>${t.title}</h1><p>${t.intro}</p><p>${t.intro2}</p>
      <div class="levels"><h2>${t.choose}</h2><ul>${lv}</ul></div></section>`;
  } else if(state.screen==="quiz"){
    const QS=LEVELS[state.level], Q=QS[state.i], L=Q[lang], ans=state.answers[state.i];
    const prog=QS.map((_,k)=>{let c="";if(k<state.answers.length)c=state.answers[k]===0?"ok":"no";else if(k===state.i)c="cur";return `<span class="${c}"></span>`;}).join("");
    const opts=state.order[state.i].map(oi=>{
      let cls=""; if(ans!==undefined){ if(oi===0)cls="right"; else if(oi===ans)cls="wrong"; else cls="dim"; }
      return `<li><button data-opt="${oi}" class="${cls}" ${ans!==undefined?"disabled":""}>${L.o[oi]}</button></li>`;}).join("");
    let fb="";
    if(ans!==undefined){
      const right=ans===0;
      const view=EUROPE.has(Q.place)?"e":"w";
      const map=`<div class="mapwrap">${mapSVG(view,[{id:Q.place, st:"ok"}],true)}</div>`;
      const src=Q.src?`<p class="src">${t.src} <a href="${SRC(Q.src[0])}" target="_blank" rel="noopener">${Q.src[1]}</a></p>`:"";
      const lit=Q.lit?`<p class="lit">${t.read} ${Q.lit}</p>`:"";
      const more=Q.more?`<p class="src more"><a href="${Q.more}" target="_blank" rel="noopener">${t.more}</a></p>`:"";
      fb=`<div class="feedback ${right?"ok":"no"} fade"><h3>${right?t.ok:t.no+" "+L.o[0]}</h3><p>${L.e}</p>${map}${src}${more}${lit}</div>
        <button class="btn" id="next">${state.i<QS.length-1?t.next:t.finish}</button>`;
    }
    body=`<section class="fade" aria-label="${t.q} ${state.i+1} ${t.of} ${QS.length}">
      <div class="progress" aria-hidden="true">${prog}</div>
      <div class="quaestio"><div class="numeral" aria-hidden="true">${ROMAN[state.i]}</div>
      <div><p class="q-kicker">${t.lv[state.level][0]}, ${t.q} ${state.i+1} ${t.of} ${QS.length}</p><h2 class="q-text">${L.q}</h2></div></div>
      <ol class="options">${opts}</ol>${fb}</section>`;
  } else {
    const score=scoreOf(), r=resultOf(), QS=LEVELS[state.level];
        // the whole network: every place from all levels; places from this round are highlighted
    const round={}; QS.forEach((q,k)=>{ round[q.place]=(round[q.place]==="ok"||state.answers[k]===0)?"ok":"no"; });
    const all=[...new Set(Object.values(LEVELS).flat().map(q=>q.place))];
    const merged=all.map(id=>({id, st:round[id]||"other"}));
    body=`<section class="result fade"><p class="score">${score}<small>/10</small></p>
      <p class="lvl-tag">${t.level}: ${t.lv[state.level][0]}</p>
      <h2 class="res-title">${r[0]}</h2><p>${r[1]}</p>
      <div class="actions"><button class="btn" id="share">${t.share}</button>
      <button class="btn ghost" id="again">${t.again}</button><button class="btn ghost" id="other">${t.other}</button></div>
      <p class="share-note" id="note" role="status"></p>
      <div class="net"><h3>${t.net}</h3><p>${t.netp}</p><div class="maps">
        ${mapSVG("w",merged,true)}
        <div>${mapSVG("e",merged,true)}<p class="mapcap">${t.europe}</p></div>
      </div>
      <ul class="legend"><li><i class="dot ok"></i>${t.lgOk}</li><li><i class="dot no"></i>${t.lgNo}</li><li><i class="dot other"></i>${t.lgOther}</li></ul>
      </div>
      <p><a class="btn ghost" href="https://www.salamanca.school" target="_blank" rel="noopener">${t.visit}</a></p></section>`;
  }
  app.innerHTML=header()+body+footer();
}

async function share(){
  const t=UI[lang], r=resultOf();
  const text=t.shareText(scoreOf(), t.lv[state.level][0], r[0]);
  const url=location.href.split("#")[0];
  const note=document.getElementById("note");
  try{ if(navigator.share){ await navigator.share({title:t.title, text, url}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  const full=text+" "+url;
  try{ await navigator.clipboard.writeText(full); note.textContent=t.copied; return; }catch(e){}
  const ta=document.createElement("textarea"); ta.value=full; ta.setAttribute("readonly",""); ta.style.position="absolute"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta); note.textContent= ok ? t.copied : full;
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang; render(); return;}
  if(b.dataset.level){newGame(b.dataset.level); return;}
  if(b.id==="again"){newGame(state.level); return;}
  if(b.id==="other"){state={screen:"intro"}; render(); window.scrollTo({top:0}); return;}
  if(b.id==="share"){share(); return;}
  if(b.dataset.opt!==undefined && state.answers[state.i]===undefined){
    state.answers[state.i]=+b.dataset.opt; render();
    const n=document.getElementById("next"); if(n) n.focus({preventScroll:true}); return;}
  if(b.id==="next"){
    if(state.i<LEVELS[state.level].length-1){state.i++;} else {state.screen="result";}
    render(); window.scrollTo({top:0});
  }
});
render();
</script>
